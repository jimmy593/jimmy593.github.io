<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈夫克全域互联终端</title>
    <style>
        /* ---- 基础样式 ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', sans-serif; }
        body {
            background: #f2f5fa; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.6) 0%, transparent 40%);
            background-color: #e9eef6; padding: 2rem;
        }
        .main-container { display: flex; width: 100%; max-width: 1280px; align-items: center; justify-content: space-between; gap: 4rem; padding: 0 2rem; }
        
        /* ---- 左侧品牌样式 ---- */
        .brand-section { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 300px; }
        .top-left-info { position: absolute; top: -40px; left: 0; color: #2a3a5a; font-size: 0.8rem; text-align: left; }
        .top-left-info .haavk-text { font-weight: 800; font-size: 1.1rem; letter-spacing: 3px; color: #1e2b47; }
        .top-left-info .sub-text { font-size: 0.65rem; color: #6b7c9e; margin-bottom: 1.2rem; }
        .station-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
        .station-badge .line { width: 3px; height: 20px; background: #2f6bff; border-radius: 2px; }
        .station-badge .station-num { font-size: 1.2rem; font-weight: 600; color: #1e2b47; }
        .version-info { font-size: 0.7rem; color: #6b7c9e; margin-top: 0.5rem; line-height: 1.6; }
        
        /* 标志区域尺寸 */
        .logo-large { width: 340px; display: flex; flex-direction: column; align-items: center; margin-top: 1.5rem; }
        
        /* 给图片设置好尺寸，保证排版不乱 */
        .logo-img { 
            width: 250px; 
            height: auto; 
            margin-bottom: 0.5rem;
            object-fit: contain; /* 保证图片比例不变形 */
        }

        /* ---- 右侧表单样式 ---- */
        .form-wrapper { flex: 0 0 440px; position: relative; }
        .form-card { background: #ffffff; box-shadow: 0 20px 40px rgba(0, 20, 60, 0.08); border-radius: 4px; padding: 2.5rem; width: 100%; transition: opacity 0.3s; }
        .form-card.hidden { display: none; opacity: 0; }
        .form-card h1 { font-size: 1.5rem; font-weight: 600; color: #1e2b47; margin-bottom: 0.2rem; }
        .form-card .subhead { font-size: 0.7rem; color: #8a9bb8; text-transform: uppercase; margin-bottom: 1.8rem; }
        
        .form-group { margin-bottom: 1.2rem; position: relative; }
        .form-group label { display: block; font-size: 0.8rem; color: #3a4a6a; margin-bottom: 0.4rem; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid #d0d8e8; border-radius: 3px; font-size: 0.95rem; color: #1e2b47; outline: none; background: #fafcff; transition: all 0.15s; }
        .form-group input:focus { border-color: #2f6bff; background: #ffffff; box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.1); }
        
        /* 自定义下拉框 */
        .custom-select-container { position: relative; user-select: none; }
        .custom-select-trigger { width: 100%; padding: 0.8rem 1rem; border: 1px solid #d0d8e8; border-radius: 3px; font-size: 0.95rem; color: #1e2b47; background: #fafcff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
        .custom-select-container.open .custom-select-trigger { border-color: #2f6bff; background: #ffffff; box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.1); }
        .custom-select-trigger::after { content: ''; width: 10px; height: 10px; border-right: 2px solid #3a4a6a; border-bottom: 2px solid #3a4a6a; transform: rotate(45deg); transition: transform 0.2s; margin-top: -4px; }
        .custom-select-container.open .custom-select-trigger::after { transform: rotate(-135deg); margin-top: 4px; }
        .custom-select-options { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #ffffff; border: 1px solid #d0d8e8; border-radius: 3px; box-shadow: 0 10px 25px rgba(0, 20, 60, 0.1); z-index: 100; max-height: 250px; overflow-y: auto; opacity: 0; visibility: hidden; transform: translateY(-5px); transition: all 0.2s; }
        .custom-select-container.open .custom-select-options { opacity: 1; visibility: visible; transform: translateY(0); }
        .custom-select-option { padding: 0.8rem 1rem; font-size: 0.9rem; color: #1e2b47; cursor: pointer; transition: background 0.15s, color 0.15s; }
        .custom-select-option:hover { background-color: #6b7280; color: #ffffff; } 
        .custom-select-option.selected { background-color: #f0f4fa; color: #2f6bff; font-weight: 500; }
        .custom-select-option.selected:hover { background-color: #6b7280; color: #ffffff; }

        .submit-btn { width: 100%; background: #2f6bff; color: white; border: none; padding: 0.9rem; font-size: 1rem; font-weight: 500; border-radius: 3px; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .submit-btn:hover { background: #1f5aef; }
        .action-link { text-align: center; font-size: 0.85rem; color: #6b7c9e; margin-top: 1.2rem; }
        .action-link a { color: #2f6bff; text-decoration: none; cursor: pointer; }
        .action-link a:hover { text-decoration: underline; }

        /* ---- 底部红字提示样式 ---- */
        .error-msg { 
            color: #ff4d4f; 
            font-size: 0.8rem; 
            margin-top: 1rem; 
            text-align: center; 
            min-height: 18px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .error-msg.show { opacity: 1; }

        @media (max-width: 980px) {
            .main-container { flex-direction: column; gap: 3rem; padding: 2rem 1rem; }
            .brand-section { width: 100%; min-width: auto; }
            .top-left-info { position: static; text-align: center; margin-bottom: 1rem; }
            .form-wrapper { width: 100%; max-width: 450px; }
        }
    </style>
</head>

    <!-- 右侧表单区域 -->
    <div class="form-wrapper">
        <!-- 登录表单 -->
        <div id="loginForm" class="form-card">
            <h1>哈夫克全域互联终端</h1>
            <div class="subhead">HAAVK UNIVERSAL TERMINAL · 员工接入</div>
            <form id="loginFormEl">
                <div class="form-group">
                    <label>员工账号</label>
                    <input type="text" id="login-account" placeholder="请输入账号">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入接入密码">
                </div>
                <button type="submit" class="submit-btn">接入职业生涯</button>
                
                <div class="error-msg" id="loginError"></div>
            </form>
            
            <div class="action-link">还没有账号？<a onclick="toggleView('register')">办理员工入职登记 →</a></div>
        </div>

        <!-- 入职登记表单 -->
        <div id="registerForm" class="form-card hidden">
            <h1>哈夫克全域互联终端</h1>
            <div class="subhead">HAAVK UNIVERSAL TERMINAL · 员工接入</div>
            <form id="registerFormEl">
                <div class="form-group">
                    <label>员工账号（英文 / 数字）</label>
                    <input type="text" id="reg-account" placeholder="请输入账号">
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="reg-name" placeholder="请输入显示名称">
                </div>
                <div class="form-group">
                    <label>所属部门</label>
                    <div class="custom-select-container" id="deptSelect">
                        <div class="custom-select-trigger"><span id="deptLabel">安全防卫部</span></div>
                        <div class="custom-select-options">
                            <div class="custom-select-option" data-value="地方关系分局">地方关系分局</div>
                            <div class="custom-select-option" data-value="人力资源中心">人力资源中心</div>
                            <div class="custom-select-option" data-value="效能部">效能部</div>
                            <div class="custom-select-option" data-value="财务部">财务部</div>
                            <div class="custom-select-option" data-value="工程部">工程部</div>
                            <div class="custom-select-option" data-value="后勤保障部">后勤保障部</div>
                            <div class="custom-select-option" data-value="人工智能研发部">人工智能研发部</div>
                            <div class="custom-select-option" data-value="技术工程部">技术工程部</div>
                            <div class="custom-select-option" data-value="品牌营销部">品牌营销部</div>
                            <div class="custom-select-option" data-value="非必要人员滞留部">非必要人员滞留部</div>
                            <div class="custom-select-option selected" data-value="安全防卫部">安全防卫部</div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>接入密码</label>
                    <input type="password" id="reg-password" placeholder="至少 6 位">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="reg-confirm" placeholder="再次输入密码">
                </div>
                <button type="submit" class="submit-btn">提交入职登记</button>
                
                <div class="error-msg" id="regError"></div>
            </form>
            
            <div class="action-link"><a onclick="toggleView('login')">← 返回接入登录</a></div>
        </div>
    </div>
</div>

<script>
    // 视图切换
    function toggleView(viewType) {
        document.getElementById('deptSelect').classList.remove('open');
        document.getElementById('loginError').classList.remove('show');
        document.getElementById('regError').classList.remove('show');

        if (viewType === 'register') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        } else {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }

    // 下拉框逻辑
    const deptSelect = document.getElementById('deptSelect');
    const deptLabel = document.getElementById('deptLabel');
    
    deptSelect.querySelector('.custom-select-trigger').addEventListener('click', function(e) {
        e.stopPropagation();
        deptSelect.classList.toggle('open');
    });
    
    document.querySelectorAll('.custom-select-option').forEach(option => {
        option.addEventListener('click', function() {
            deptLabel.textContent = this.textContent;
            document.querySelectorAll('.custom-select-option').forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
            deptSelect.classList.remove('open');
        });
    });
    
    document.addEventListener('click', function(e) {
        if (!deptSelect.contains(e.target)) deptSelect.classList.remove('open');
    });

    // 显示底部红字提示
    function showError(elementId, message, isSuccess = false) {
        const errorEl = document.getElementById(elementId);
        errorEl.textContent = message;
        errorEl.style.color = isSuccess ? '#52c41a' : '#ff4d4f'; // 成功绿，失败红
        errorEl.classList.add('show');
    }

    // 1. 登录校验
    document.getElementById('loginFormEl').addEventListener('submit', function(e) {
        e.preventDefault();
        const account = document.getElementById('login-account').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const errorId = 'loginError';

        document.getElementById(errorId).classList.remove('show');

        if (!account) return showError(errorId, '请输入员工账号');
        if (!password) return showError(errorId, '请输入接入密码');

        showError(errorId, '身份验证中... (演示界面，无真实后台)', true);
    });

    // 2. 入职登记校验
    document.getElementById('registerFormEl').addEventListener('submit', function(e) {
        e.preventDefault();
        const account = document.getElementById('reg-account').value.trim();
        const name = document.getElementById('reg-name').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPwd = document.getElementById('reg-confirm').value;
        const errorId = 'regError';

        document.getElementById(errorId).classList.remove('show');

        if (!account) return showError(errorId, '请输入员工账号');
        if (!name) return showError(errorId, '请输入显示名称');
        if (password.length < 6) return showError(errorId, '接入密码至少需要 6 位');
        if (password !== confirmPwd) return showError(errorId, '两次输入的密码不一致');

        showError(errorId, '入职登记成功！(演示界面，无真实后台)', true);
        
        this.reset();
        setTimeout(() => {
            document.getElementById(errorId).classList.remove('show');
            toggleView('login');
        }, 2000);
    });

    // 动态更新时间
    setInterval(() => {
        const now = new Date();
        const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        document.querySelector('.version-info').innerHTML = `VERSION<br>V1.0.0<br>${timeStr}`;
    }, 1000);
</script>
</body>
</html>
