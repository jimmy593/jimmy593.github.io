<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈夫克全域互联终端 - 登录</title>
    <style>
        /* 重置 & 基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 模拟截图中的浅灰色纹理背景 */
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.6) 0%, transparent 40%);
            background-color: #e9eef6;
            padding: 2rem;
        }

        /* 主容器 - 模拟图片整体布局 */
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1280px;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
            padding: 0 2rem;
        }

        /* ========= 左侧：品牌与信息区域 ========= */
        .brand-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 300px;
        }

        /* 左上角信息块 - 绝对定位 */
        .top-left-info {
            position: absolute;
            top: -20px;
            left: 0;
            color: #2a3a5a;
            font-size: 0.8rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-align: left;
        }

        .top-left-info .haavk-text {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #1e2b47;
            margin-bottom: 2px;
        }

        .top-left-info .sub-text {
            font-size: 0.65rem;
            color: #6b7c9e;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .station-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.75rem;
        }

        .station-badge .line {
            width: 3px;
            height: 20px;
            background: #2f6bff;
            border-radius: 2px;
        }

        .station-badge .station-num {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e2b47;
        }

        .station-badge .station-label {
            font-size: 0.7rem;
            color: #6b7c9e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .version-info {
            font-size: 0.7rem;
            color: #6b7c9e;
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        /* 中央大 LOGO */
        .logo-large {
            width: 300px;
            height: auto;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 图形 LOGO - 用 SVG 精确绘制 */
        .logo-icon {
            width: 220px;
            height: 220px;
            display: block;
            margin-bottom: 1rem;
        }

        /* 底部 HAAVK 文字 LOGO */
        .logo-text-svg {
            width: 240px;
            height: auto;
        }

        /* ========= 右侧：登录表单卡片 ========= */
        .login-card {
            flex: 0 0 420px;
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 20, 60, 0.08), 0 6px 12px rgba(0, 0, 0, 0.02);
            border-radius: 2px;
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            transition: all 0.2s;
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e2b47;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .login-card .subhead {
            font-size: 0.7rem;
            color: #8a9bb8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #3a4a6a;
            margin-bottom: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #d0d8e8;
            border-radius: 2px;
            font-size: 0.95rem;
            color: #1e2b47;
            outline: none;
            transition: all 0.15s;
            background: #fafcff;
        }

        .form-group input::placeholder {
            color: #a8b6cc;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            border-color: #2f6bff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: #2f6bff;
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .submit-btn:hover {
            background: #1f5aef;
        }

        .submit-btn:active {
            background: #154ad0;
            transform: scale(0.99);
        }

        .register-link {
            text-align: center;
            font-size: 0.85rem;
            color: #6b7c9e;
            cursor: default;
        }

        .register-link a {
            color: #2f6bff;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s;
        }

        .register-link a:hover {
            border-bottom-color: #2f6bff;
        }

        /* 响应式调整 */
        @media (max-width: 980px) {
            .main-container {
                flex-direction: column;
                gap: 3rem;
                padding: 2rem 1rem;
            }

            .brand-section {
                width: 100%;
                min-width: auto;
            }

            .top-left-info {
                position: static;
                text-align: center;
                margin-bottom: 1rem;
                width: 100%;
            }

            .station-badge {
                justify-content: center;
            }

            .login-card {
                flex: 0 0 auto;
                width: 100%;
                max-width: 450px;
            }

            .logo-large {
                margin-top: 0;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem 1.5rem;
            }
            .login-card h1 {
                font-size: 1.3rem;
            }
            .logo-icon {
                width: 160px;
                height: 160px;
            }
            .logo-text-svg {
                width: 180px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左侧品牌区域 -->
    <div class="brand-section">
        <!-- 左上角信息 -->
        <div class="top-left-info">
            <div class="haavk-text">HAAVK</div>
            <div class="sub-text">GLOBAL INTERNET TERMINALS</div>
            
            <div class="station-badge">
                <div class="line"></div>
                <span class="station-num">01</span>
            </div>
            <div style="font-size:0.7rem; color:#3a4a6a; letter-spacing:1px; font-weight:500; margin-left:5px;">FIRST STATION</div>
            
            <div class="version-info">
                VERSION<br>
                V1.0.0<br>
                2026-11-10 12:59:24
            </div>
        </div>

        <!-- 大 LOGO 区域 (图形 + 文字) -->
        <div class="logo-large">
            <!-- 图形 LOGO: 三个蓝色几何形状组合 -->
            <svg class="logo-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 左侧菱形 -->
                <path d="M95 30 L55 90 L95 150 L135 90 Z" fill="#2F6BFF" opacity="0.9"/>
                <!-- 中间竖条 + 倾斜切角 -->
                <path d="M100 15 L100 100 L120 80 L120 30 L100 15Z" fill="#2F6BFF"/>
                <path d="M80 90 L80 170 L100 155 L100 105 L80 90Z" fill="#2F6BFF"/>
                <!-- 右侧三角形 -->
                <path d="M140 60 L180 100 L140 140 Z" fill="#2F6BFF" opacity="0.9"/>
            </svg>

            <!-- 底部 HAAVK 文字 LOGO (使用 SVG 精确绘制几何字形) -->
            <svg class="logo-text-svg" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- H -->
                <path d="M10 10 L10 50 L22 50 L22 34 L38 34 L38 50 L50 50 L50 10 L38 10 L38 26 L22 26 L22 10 L10 10Z" fill="#1E2B47"/>
                <!-- A -->
                <path d="M68 50 L80 10 L92 10 L104 50 L92 50 L88 38 L84 38 L80 50 L68 50Z M86 28 L82 28 L84 18 L86 28Z" fill="#1E2B47"/>
                <!-- A -->
                <path d="M120 50 L132 10 L144 10 L156 50 L144 50 L140 38 L136 38 L132 50 L120 50Z M138 28 L134 28 L136 18 L138 28Z" fill="#1E2B47"/>
                <!-- V (用两个斜线表示) -->
                <path d="M172 10 L184 50 L196 50 L208 10 L196 10 L188 38 L180 10 L172 10Z" fill="#1E2B47"/>
                <!-- K -->
                <path d="M220 10 L220 50 L232 50 L232 36 L246 50 L260 50 L242 30 L260 10 L246 10 L232 24 L232 10 L220 10Z" fill="#1E2B47"/>
            </svg>
        </div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="login-card">
        <h1>哈夫克全域互联终端</h1>
        <div class="subhead">HAAVK UNIVERSAL TERMINAL · 员工接入</div>

        <form action="#" method="post" onsubmit="event.preventDefault(); alert('演示界面 — 接入职业生涯 (模拟)');">
            <div class="form-group">
                <label for="account">员工账号</label>
                <input type="text" id="account" name="account" placeholder="请输入账号" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入接入密码" autocomplete="off">
            </div>

            <button type="submit" class="submit-btn">接入职业生涯</button>
        </form>

        <div class="register-link">
            还没有账号？<a href="#" onclick="alert('办理员工入职登记 (模拟)'); return false;">办理员工入职登记 →</a>
        </div>
    </div>
</div>

</body>
</html>
