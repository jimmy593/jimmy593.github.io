<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈夫克全域互联终端</title>
    <style>
        /* 重置 & 基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #f2f5fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 浅色科技背景纹理 */
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.6) 0%, transparent 40%);
            background-color: #e9eef6;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* 主容器 */
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1280px;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
            padding: 0 2rem;
        }

        /* ========= 左侧：品牌与信息区域 ========= */
        .brand-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 300px;
        }

        /* 左上角信息块 */
        .top-left-info {
            position: absolute;
            top: -40px;
            left: 0;
            color: #2a3a5a;
            font-size: 0.8rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-align: left;
        }

        .top-left-info .haavk-text {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #1e2b47;
            margin-bottom: 2px;
        }

        .top-left-info .sub-text {
            font-size: 0.65rem;
            color: #6b7c9e;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .station-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.75rem;
        }

        .station-badge .line {
            width: 3px;
            height: 20px;
            background: #2f6bff;
            border-radius: 2px;
        }

        .station-badge .station-num {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e2b47;
        }

        .station-badge .station-label {
            font-size: 0.7rem;
            color: #6b7c9e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .version-info {
            font-size: 0.7rem;
            color: #6b7c9e;
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        /* 中央大 LOGO */
        .logo-large {
            width: 320px;
            height: auto;
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-icon {
            width: 240px;
            height: 240px;
            display: block;
            margin-bottom: 1rem;
        }

        .logo-text-svg {
            width: 260px;
            height: auto;
            margin-top: 10px;
        }

        /* ========= 右侧：表单卡片容器 ========= */
        .form-wrapper {
            flex: 0 0 440px;
            position: relative;
            /* 高度由内部表单撑开 */
        }

        /* 卡片通用样式 */
        .form-card {
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 20, 60, 0.08), 0 6px 12px rgba(0, 0, 0, 0.02);
            border-radius: 4px;
            padding: 2.5rem;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* 隐藏状态 */
        .form-card.hidden {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }

        .form-card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e2b47;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .form-card .subhead {
            font-size: 0.7rem;
            color: #8a9bb8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #3a4a6a;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #d0d8e8;
            border-radius: 3px;
            font-size: 0.95rem;
            color: #1e2b47;
            outline: none;
            transition: all 0.15s;
            background: #fafcff;
            appearance: none; /* 移除原生下拉箭头 */
        }

        /* 为下拉框添加自定义箭头 */
        .form-group select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a4a6a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            cursor: pointer;
        }

        .form-group input::placeholder {
            color: #a8b6cc;
            font-size: 0.9rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2f6bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: #2f6bff;
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: #1f5aef;
        }

        .action-link {
            text-align: center;
            font-size: 0.85rem;
            color: #6b7c9e;
            margin-top: 1.2rem;
        }

        .action-link a {
            color: #2f6bff;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .action-link a:hover {
            text-decoration: underline;
        }

        /* 响应式调整 */
        @media (max-width: 980px) {
            .main-container {
                flex-direction: column;
                gap: 3rem;
                padding: 2rem 1rem;
            }
            .brand-section {
                width: 100%;
                min-width: auto;
            }
            .top-left-info {
                position: static;
                text-align: center;
                margin-bottom: 1rem;
                width: 100%;
            }
            .station-badge {
                justify-content: center;
            }
            .form-wrapper {
                flex: 0 0 auto;
                width: 100%;
                max-width: 450px;
            }
            .logo-large {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左侧品牌区域 -->
    <div class="brand-section">
        <div class="top-left-info">
            <div class="haavk-text">HAAVK</div>
            <div class="sub-text">GLOBAL INTERNET TERMINALS</div>
            
            <div class="station-badge">
                <div class="line"></div>
                <span class="station-num">01</span>
            </div>
            <div style="font-size:0.7rem; color:#3a4a6a; letter-spacing:1px; font-weight:600; margin-left:5px;">FIRST STATION</div>
            
            <div class="version-info">
                VERSION<br>
                V1.0.0<br>
                2026-11-10 13:00:51
            </div>
        </div>

        <!-- 大 LOGO 区域 -->
        <div class="logo-large">
            <!-- 精确重绘的图形 LOGO -->
            <svg class="logo-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 左侧菱形结构 -->
                <path d="M 90 50 L 40 110 L 90 170 L 90 130 L 70 110 L 90 90 Z" fill="#2F6BFF"/>
                <!-- 中间垂直主干 (带右上切角) -->
                <path d="M 105 15 L 130 50 L 130 100 L 105 115 L 105 70 L 90 55 L 105 15 Z" fill="#2F6BFF"/>
                <!-- 右侧三角形结构 -->
                <path d="M 115 70 L 165 110 L 115 150 Z" fill="#2F6BFF"/>
                <!-- 底部尖刺结构 (覆盖在右侧上方) -->
                <path d="M 105 125 L 125 145 L 105 185 L 85 155 L 105 125 Z" fill="#2F6BFF"/>
            </svg>

            <!-- 精确重绘的文字 LOGO -->
            <svg class="logo-text-svg" viewBox="0 0 300 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- H -->
                <path d="M 10 15 L 10 45 L 25 45 L 25 33 L 35 33 L 35 45 L 50 45 L 50 15 L 35 15 L 35 25 L 25 25 L 25 15 Z" fill="#2F6BFF"/>
                <!-- A (倾斜斜切) -->
                <path d="M 60 45 L 75 15 L 90 15 L 105 45 L 90 45 L 87 37 L 78 37 L 75 45 Z M 83.5 28 L 81 28 L 82.5 22 Z" fill="#2F6BFF"/>
                <!-- A (倾斜斜切) -->
                <path d="M 115 45 L 130 15 L 145 15 L 160 45 L 145 45 L 142 37 L 133 37 L 130 45 Z M 138.5 28 L 136 28 L 137.5 22 Z" fill="#2F6BFF"/>
                <!-- V -->
                <path d="M 170 15 L 185 45 L 200 45 L 215 15 L 198 15 L 192 32 L 186 15 Z" fill="#2F6BFF"/>
                <!-- K (带有分离感) -->
                <path d="M 225 15 L 225 45 L 240 45 L 240 35 L 255 45 L 275 45 L 250 28 L 270 15 L 252 15 L 240 24 L 240 15 Z" fill="#2F6BFF"/>
            </svg>
        </div>
    </div>

    <!-- 右侧表单区域容器 -->
    <div class="form-wrapper">
        
        <!-- ================= 登录表单 ================= -->
        <div id="loginForm" class="form-card">
            <h1>哈夫克全域互联终端</h1>
            <div class="subhead">HAAVK UNIVERSAL TERMINAL · 员工接入</div>

            <!-- 使用 onsubmit 阻止表单默认提交，用于演示 -->
            <form action="#" method="post" onsubmit="event.preventDefault(); alert('演示界面 — 接入职业生涯 (模拟成功)');">
                <div class="form-group">
                    <label for="login-account">员工账号</label>
                    <input type="text" id="login-account" placeholder="请输入账号" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入接入密码" autocomplete="off" required>
                </div>

                <button type="submit" class="submit-btn">接入职业生涯</button>
            </form>

            <div class="action-link">
                还没有账号？<a onclick="toggleView('register')">办理员工入职登记 →</a>
            </div>
        </div>

        <!-- ================= 入职登记表单 ================= -->
        <div id="registerForm" class="form-card hidden">
            <h1>哈夫克全域互联终端</h1>
            <div class="subhead">HAAVK UNIVERSAL TERMINAL · 员工接入</div>

            <form action="#" method="post" onsubmit="event.preventDefault(); alert('演示界面 — 提交入职登记 (模拟成功)');">
                <div class="form-group">
                    <label for="reg-account">员工账号（英文 / 数字）</label>
                    <input type="text" id="reg-account" placeholder="请输入账号" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="reg-name">显示名称</label>
                    <input type="text" id="reg-name" placeholder="请输入显示名称" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="reg-dept">所属部门</label>
                    <select id="reg-dept" required>
                        <option value="" disabled selected>请选择所属部门</option>
                        <option value="security" selected>安全防卫部</option>
                        <option value="tech">技术支持部</option>
                        <option value="logistics">物流统筹部</option>
                        <option value="research">核心研发部</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-password">接入密码</label>
                    <input type="password" id="reg-password" placeholder="至少 6 位" minlength="6" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm">确认密码</label>
                    <input type="password" id="reg-confirm" placeholder="再次输入密码" minlength="6" autocomplete="off" required>
                </div>

                <button type="submit" class="submit-btn">提交入职登记</button>
            </form>

            <div class="action-link">
                <a onclick="toggleView('login')">← 返回接入登录</a>
            </div>
        </div>

    </div>
</div>

<script>
    /**
     * 切换视图功能
     * @param {string} viewType - 'login' 或 'register'
     */
    function toggleView(viewType) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        if (viewType === 'register') {
            // 切换到注册页
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        } else {
            // 切换到登录页
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        }
    }

    // 动态更新时间（模拟终端显示）
    function updateTime() {
        const timeEl = document.querySelector('.version-info');
        if(timeEl) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            // 保留原有的结构，只更新时间和日期部分
            timeEl.innerHTML = `VERSION<br>V1.0.0<br>${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
    }
    
    // 页面加载完成后启动时钟
    window.onload = function() {
        updateTime();
        setInterval(updateTime, 1000); // 每秒刷新
    };
</script>
</body>
</html>
